name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Install package with dev extras
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest -q
